<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Resume</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #333333;
      margin-bottom: 25px;
      font-size: 26px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      display: block;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      transition: background-color 0.3s ease, transform 0.1s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-view {
      background-color: #007bff;
      color: #ffffff;
    }

    .btn-view:hover {
      background-color: #0056b3;
    }

    .btn-download {
      background-color: #28a745;
      color: #ffffff;
    }

    .btn-download:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>My Resume</h1>

    <div class="btn-group">
      <!-- रेज़्यूमे नई टैब में देखने के लिए (target="_blank") -->
      <a href="Sarfraz_Alam_TechSupport_4Years.pdf" target="_blank" class="btn btn-view">
        See My Resume
      </a>

      <!-- रेज़्यूमे सीधे डाउनलोड करने के लिए (download एट्रिब्यूट) -->
      <a href="Sarfraz_Alam_TechSupport_4Years.pdf" download="Sarfraz_Alam_TechSupport_4Years.pdf" class="btn btn-download">
        Download My Resume
      </a>
    </div>
  </div>

</body>
</html>
